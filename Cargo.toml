[package]
name = "zenithsw"
version = "0.1.0"
edition = "2021"
authors = ["Gito <dev@suginode.local>", "Hinsyah <sham607>"]
description = "ZenithSW - Multi-Chain Smart Money Shadow Trading Engine & TUI Dashboard"

[lib]
name = "zenithsw"
path = "src/lib.rs"

[[bin]]
name = "zenithsw"
path = "src/main.rs"

[[bin]]
name = "zenithsw-engine"
path = "src/bin/engine.rs"

[[bin]]
name = "robinhood-dry-run"
path = "src/bin/robinhood_dry_run.rs"

[[bin]]
name = "config-audit"
path = "src/bin/config_audit.rs"

[[bin]]
name = "radar-migrate-audit"
path = "src/bin/radar_migrate_audit.rs"

[[bin]]
name = "radar-readonly-probe"
path = "src/bin/radar_readonly_probe.rs"

[[bin]]
name = "robinhood-readonly-audit"
path = "src/bin/robinhood_readonly_audit.rs"

[[bin]]
name = "robinhood-tx-audit"
path = "src/bin/robinhood_tx_audit.rs"

[[bin]]
name = "solana-canary"
path = "src/bin/solana_canary.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
dotenvy = "0.15"
bs58 = "0.5"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
base64 = "0.22"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
